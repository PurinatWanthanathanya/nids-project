name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. CI Stage: SAST & Automated PCAP Testing
  # ==========================================
  ci-test-and-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libpcap-dev
          pip install -r requirements.txt

      - name: SAST Security Scan (Bandit)
        run: bandit -r src/ -ll

      - name: Synthetic PCAP Regression Tests (Pytest)
        run: |
          python scripts/generate_pcaps.py
          pytest -v

  # ==========================================
  # 2. CD Stage: Container Build, Trivy Scan & Push to GHCR
  # ==========================================
  cd-build-and-publish:
    needs: ci-test-and-sast
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):latest"
          echo "IMAGE_NAME=$IMAGE" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: "table"
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GHCR (Continuous Delivery)
        run: docker push ${{ env.IMAGE_NAME }}

